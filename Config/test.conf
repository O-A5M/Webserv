server 
{
    listen 8080;
    listen 8081;
    server_name localhost;

    root /var/www/html;
    index index.html;

    client_max_body_size 1000000;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        index index.html;
        autoindex off;
    }
    
    location / {
        index index.html;
        autoindex off;
    }
}

