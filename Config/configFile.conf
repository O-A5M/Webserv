server
{
	listen 8080;
	server_name localhost;

	root ./www/;
	index index.html;

	client_max_body_size 1000000;

	error_page 404 /errors/404.html;
	error_page 500 /errors/500.html;

	location /
	{
		root ./www/;
		index index.html;
		autoindex on;
		cgi_extension .py;
		allow_methods GET POST DELETE;
	}

	location /index
	{
		root ./www/ddd;
		index index.html;
		autoindex on;
		cgi_extension .php;
		allow_methods GET POST DELETE;
	}

	location /empty{
		root ./www;
		# return 301 /index.html;
		autoindex on;
		index walid.html;
		allow_methods GET POST DELETE;
	}

	location /ddd{
		root ./www;
		# return 301 /index.html;
		autoindex on;
		index walid.html;
		allow_methods GET POST DELETE;
	}
	location /img
	{
		root ./www;
		# index age.html;
		autoindex on;
		allow_methods GET POST;
	}
	location /cgi-bin
	{
		root ./www;
		autoindex off;
		cgi_path /cgi-bin/python.php;
		allow_methods GET POST DELETE;
		cgi_extension .php;
	}
}

