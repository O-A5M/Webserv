server
{
	listen 8080;
	server_name localhost;

	root ./www;
	index index.html;
	client_max_body_size 5;


	error_page 404 /errors/404.html;
	error_page 500 /errors/500.html;
	error_page 413 /errors/413.html;

	location /
	{
		root ./www;
		upload_store ./www/jj;
		client_max_body_size 355500;

		autoindex off;
		index index.html;
		allow_methods GET POST DELETE;
	}

	location /empty{
		root ./www;
		# return 301 /index.html;
		autoindex on;
		index walid.html;
		allow_methods GET POST DELETE;
	}

	location /upload
	{
		upload_store ./www/upload;
		client_max_body_size 5000000000;
		root ./www;
		autoindex on;
	}

	location /ddd{
		root ./www;
		# return 301 /index.html;
		autoindex on;
		index walid.html;
		allow_methods GET POST DELETE;
	}
	location /img
	{
		root ./www/;
		# index age.html;
		autoindex on;
		allow_methods GET POST;
	}
}

