server
{
    listen 8080;
    server_name localhost;

    root ./www;
    index index.html;
    client_max_body_size 1000000;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    error_page 413 /errors/413.html;

    location /
    {
        root ./www;
        upload_store ./www/jj;
        client_max_body_size 1000000;
        autoindex on;
        allow_methods GET POST DELETE;
    }

    location /old
    {
        return 301 /redir.html;
    }

    location /upload
    {
        root ./www;
        upload_store ./www/upload;
        client_max_body_size 1000000;
        autoindex on;
        allow_methods GET POST DELETE;
    }

    location /img
    {
        root ./www;
        autoindex on;
        allow_methods GET POST;
    }

    location /cgi-bin
    {
        root ./www;
        autoindex off;
        cgi_path /usr/bin/python3;
        cgi_extension .py;
        allow_methods GET POST DELETE;
    }
}