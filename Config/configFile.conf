server
{
	listen 8080;
	server_name localhost;

	root ./www/;
	index index.html;

	client_max_body_size 1000000;

	error_page 404 /errors/404.html;
	error_page 500 /errors/500.html;

	location / {
		root ./www;
		index index.html;
		autoindex off;
		allow_methods GET POST DELETE;
	}

	location /uploads
	{
		root /var/www/html/uploads;
		autoindex on;
		allow_methods GET POST;
	}
}
