server
{
	listen 8080;
	server_name localhost;

	root ./www;
	index index.html;
	#client_max_body_size 5;


	error_page 404 /errors/404.html;
	error_page 500 /errors/500.html;
	error_page 413 /errors/413.html;

	location /
	{
		root ./www;
		upload_store ./www/jj;
		client_max_body_size 355500;
		autoindex on;
	#	index index.html;
		allow_methods GET POST DELETE;
	}
	location /old
	{
    	return 301 /redir.html;
	}
	location /empty{
		root ./www;
		autoindex on;
		index walid.html;
		allow_methods GET POST DELETE;
	}

	location /upload
	{
		upload_store ./www/upload;
		root ./www;
		#client_max_body_size 3555000000000;
		autoindex on;
		allow_methods GET POST DELETE;
	}

	location /ddd{
		root ./www;
		autoindex on;
		index walid.html;
		allow_methods GET POST DELETE;
	}
	location /img
	{
		root ./www/;
		autoindex on;
		allow_methods GET POST;
	}
	location /cgi-bin
	{
#		root ./www;
		autoindex off;
		cgi_path /usr/bin/python3;
		allow_methods GET POST DELETE;
		cgi_extension .py;
	}
}

server
{
	listen 8081;
	server_name localhost;

	root ./www;
	index index.html;
	client_max_body_size 5;


	error_page 404 /errors/404.html;
	error_page 500 /errors/500.html;
	error_page 413 /errors/413.html;

	location /
	{
		root ./www;
		upload_store ./www/jj;
		client_max_body_size 355500;

		autoindex off;
		index index.html;
		allow_methods GET POST DELETE;
	}
}