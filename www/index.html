<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webserv Creator Team</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scanlines"></div>
    <canvas id="networkCanvas"></canvas>

    <div id="matrix-intro" class="matrix-intro">
      <span id="typewriter"></span><span class="cursor">_</span>
    </div>

    <div class="server-status init-hidden">
      <span class="status-dot"></span>
      <span class="status-code">HTTP/1.1 200 OK_</span>
    </div>

    <div class="content-wrapper init-hidden">
      <header>
        <h1>Meet the Webserv Creators</h1>
				<a href="/upload-test.html" class="upload-btn">Test POST Uploads</a>
      </header>

      <main class="team-container">
        <article class="team-member">
          <div class="img-wrapper">
            <img src="/img/walid.png" alt="Walid - Core Developer" />
            <div class="overlay"></div>
          </div>
          <h2>Walid</h2>
          <span class="role">Core Developer</span>
        </article>

        <article class="team-member">
          <div class="img-wrapper">
            <img src="/img/achraf.png" alt="Achraf - Core Developer" />
            <div class="overlay"></div>
          </div>
          <h2>Achraf</h2>
          <span class="role">Core Developer</span>
        </article>

        <article class="team-member">
          <div class="img-wrapper">
            <img src="/img/othman.png" alt="Othman - Core Developer" />
            <div class="overlay"></div>
          </div>
          <h2>Othman</h2>
          <span class="role">Core Developer</span>
        </article>
      </main>
    </div>

    <script src="main.js"></script>
  </body>
</html>
