<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webserv — Cookies &amp; Session Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:            #0f172a;
  --card:          #1e293b;
  --card-glass:    rgba(30, 41, 59, 0.55);
  --border:        rgba(148, 163, 184, 0.16);
  --border-strong: rgba(148, 163, 184, 0.28);

  --text:          #f8fafc;
  --text-secondary:#94a3b8;
  --text-dim:      #64748b;

  --accent-blue:   #3b82f6;
  --accent-cyan:   #22d3ee;
  --accent-grad:   linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));

  --ok:            #34d399;
  --ok-bg:         rgba(52, 211, 153, 0.12);
  --danger:        #f87171;
  --danger-bg:     rgba(248, 113, 113, 0.12);

  --font-display:  'Sora', sans-serif;
  --font-body:     'Inter', sans-serif;
  --font-mono:     'JetBrains Mono', monospace;

  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 8px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(59,130,246,0.14), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.6;
  min-height:100vh;
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}
code,.mono{ font-family:var(--font-mono); }
a:focus-visible, button:focus-visible{ outline:2px solid var(--accent-cyan); outline-offset:3px; border-radius:var(--radius-sm); }

.wrap{ max-width:720px; margin:0 auto; padding:56px 24px 80px; }

.reveal{ opacity:0; transform:translateY(16px); animation:reveal .6s var(--ease) forwards; }
@keyframes reveal{ to{ opacity:1; transform:none; } }

/* Hero */
.hero{ text-align:center; margin-bottom:40px; }
.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:.78rem; color:var(--accent-cyan);
  background:rgba(34,211,238,0.08); border:1px solid rgba(34,211,238,0.22);
  padding:6px 14px; border-radius:999px; margin-bottom:20px;
}
.hero h1{
  font-family:var(--font-display); font-weight:800;
  font-size:clamp(1.8rem, 5vw, 2.6rem); letter-spacing:-0.02em; line-height:1.1;
}
.hero p{ max-width:460px; margin:14px auto 0; color:var(--text-secondary); font-size:1rem; }

/* Visitor card */
.card{
  background:var(--card-glass);
  border:1px solid var(--border-strong);
  border-radius:var(--radius-lg);
  padding:32px;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 30px rgba(0,0,0,0.35);
  text-align:center;
  margin-bottom:28px;
}
.card__icon{
  width:56px; height:56px; margin:0 auto 16px;
  border-radius:16px; background:var(--accent-grad);
  display:flex; align-items:center; justify-content:center; font-size:1.6rem;
  box-shadow:0 10px 26px rgba(59,130,246,0.35);
}
.card__label{ color:var(--text-secondary); font-size:.95rem; margin-bottom:6px; }
.count{
  font-family:var(--font-display); font-weight:800;
  font-size:clamp(2.2rem,6vw,3rem); line-height:1;
  background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.count.bump{ animation:bump .5s var(--ease); }
@keyframes bump{ 35%{ transform:scale(1.1); filter:brightness(1.3); } }

.meta-row{
  display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:18px;
}
.pill{
  display:inline-flex; align-items:center; gap:6px;
  font-size:.82rem; font-weight:600; padding:7px 13px; border-radius:999px;
}
.pill--ok{ background:var(--ok-bg); color:var(--ok); border:1px solid rgba(52,211,153,0.3); }
.pill--dim{ background:rgba(148,163,184,0.08); color:var(--text-secondary); border:1px solid var(--border-strong); font-family:var(--font-mono); }

/* Actions */
.section-title{
  font-family:var(--font-display); font-size:1rem; font-weight:700;
  color:var(--text-secondary); margin-bottom:14px; text-align:center;
}
.actions{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
.actions form{ margin:0; }
.btn{
  appearance:none; border:none; cursor:pointer;
  font-family:var(--font-body); font-weight:600; font-size:.9rem;
  padding:12px 20px; border-radius:var(--radius-sm);
  display:inline-flex; align-items:center; gap:8px;
  transition:transform .25s var(--ease), box-shadow .25s var(--ease), filter .25s var(--ease);
}
.btn:active{ transform:translateY(1px) scale(0.98); }
.btn--primary{ background:var(--accent-grad); color:#06121f; box-shadow:0 8px 20px rgba(59,130,246,0.3); }
.btn--primary:hover{ filter:brightness(1.08); transform:translateY(-2px); }
.btn--danger{ background:var(--danger-bg); color:var(--danger); border:1px solid rgba(248,113,113,0.3); }
.btn--danger:hover{ background:rgba(248,113,113,0.18); transform:translateY(-2px); }

footer{ margin-top:56px; text-align:center; color:var(--text-dim); font-size:.82rem; }
footer strong{ color:var(--text-secondary); }

</style>
</head>
<body>

<div class="wrap">

  <header class="hero reveal">
    <span class="eyebrow">🍪 Bonus Feature</span>
    <h1>Cookies &amp; Session Demo</h1>
    <p>Demonstrates cookie and session support implemented in my Webserv project.</p>
  </header>

  <!-- Visitor card -->
  <section class="card reveal" style="animation-delay:.08s">
    <div class="card__icon">👤</div>
    <div class="card__label">You have visited this page</div>
    <div class="count" id="visitCount">{{VISIT_COUNT}}</div>
    <div class="card__label" style="margin-top:2px;">times</div>

    <div class="meta-row">
      <span class="pill pill--ok">✓ Cookie Found</span>
      <span class="pill pill--dim">Session ID: {{SESSION_ID_MASKED}}</span>
    </div>
  </section>

  <!-- Actions -->
  <section class="reveal" style="animation-delay:.2s">
    <div class="section-title">Actions</div>
    <div class="actions">
      <form action="/cookies" method="GET">
        <input type="hidden" name="action" value="visit">
        <button type="submit" class="btn btn--primary">➕ Visit Again</button>
      </form>
      <form action="/cookies" method="GET">
        <input type="hidden" name="action" value="clear">
        <button type="submit" class="btn btn--danger">✕ Clear Cookies</button>
      </form>
    </div>
  </section>

  <footer class="reveal" style="animation-delay:.26s">
    <p>Built for <strong>Webserv</strong> — 42 School · Cookies &amp; Session Management Demo</p>
  </footer>

</div>

<script>
  window.addEventListener('DOMContentLoaded', function () {
    var counter = document.getElementById('visitCount');
    if (counter) requestAnimationFrame(function () { counter.classList.add('bump'); });
  });
</script>

</body>
</html>
